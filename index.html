<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamasteOtaku | Ultimate Shield Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9933; --bg: #0a0a0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: white; overflow-x: hidden; }

        nav { padding: 15px 6%; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }

        main { padding: 20px 6%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #111; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 2/3; border: 1px solid #222; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* --- THE ULTIMATE SHIELD PLAYER --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        
        .player-container {
            width: 100%; max-width: 900px;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #ytPlayer {
            position: absolute;
            top: -12%; /* Title Hide */
            left: -1%;
            width: 102%;
            height: 124%;
            border: none;
        }

        /* लेयर 1: ऊपर का हिस्सा (Title/Channel) छिपाने के लिए */
        .mask-top { position: absolute; top: 0; left: 0; width: 100%; height: 55px; background: #000; z-index: 100; }

        /* लेयर 2: नीचे बाईं ओर का लोगो (YouTube Logo) छिपाने के लिए */
        .mask-logo { position: absolute; bottom: 0; left: 0; width: 150px; height: 50px; background: #000; z-index: 100; pointer-events: none; }

        /* लेयर 3: 'More Videos' शील्ड (वीडियो एंड होने पर दिखेगी) */
        #endShield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 500;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        /* कंट्रोल बार */
        .controls {
            width: 100%; max-width: 900px; background: #111; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 0 0 10px 10px; z-index: 1000;
        }

        .btn { background: var(--primary); color: black; border: none; padding: 8px 20px; border-radius: 5px; font-weight: 800; cursor: pointer; }
        .close-p { margin-top: 20px; color: #444; cursor: pointer; font-size: 12px; font-weight: 800; }
    </style>
</head>
<body>

    <nav><div class="logo">NAMASTE<span>OTAKU</span></div></nav>

    <main><div id="animeGrid" class="grid"></div></main>

    <!-- Modal Player -->
    <div class="modal" id="videoModal">
        <div class="player-container">
            <div class="mask-top"></div> <!-- Hide Title -->
            <div class="mask-logo"></div> <!-- Hide YouTube Logo -->
            
            <div id="ytPlayer"></div> <!-- API Player -->

            <!-- End Screen Shield -->
            <div id="endShield">
                <h2 style="margin-bottom: 20px;">Episode Finished</h2>
                <button class="btn" onclick="location.reload()">WATCH AGAIN</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="playBtn">PAUSE</button>
            <span id="stat" style="font-size: 12px; color: #555;">LEGAL STREAMING MODE</span>
        </div>
        
        <div class="close-p" onclick="closePlayer()">CLOSE PLAYER</div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const API_KEY = 'AIzaSyDXbfCA2l6LWwg5iURIxbCPCbUlRLGlXWE'; 
        const animeDB = [
            { name: "Classroom of the Elite", id: "PLpm1VVK4UL17x8mbfPIYWRjkCTlrqEWW5" },
            { name: "One-Punch Man", id: "PLpm1VVK4UL14XTDA9wPpCC6zKB2jUh9vY" }
        ];

        let player;
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 0,
                    'controls': 1, // Skip Ad के लिए ऑन रखना पड़ेगा
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const shield = document.getElementById('endShield');
            // अगर वीडियो खत्म हो गया (State = 0)
            if (event.data == YT.PlayerState.ENDED) {
                shield.style.display = 'flex'; // 'More Videos' को ब्लॉक करें
            } else {
                shield.style.display = 'none';
            }
        }

        async function init() {
            const grid = document.getElementById('animeGrid');
            for (const anime of animeDB) {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${anime.name}&limit=1`);
                const data = await res.json();
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => loadEpisodes(anime.id);
                card.innerHTML = `<img src="${data.data[0].images.webp.large_image_url}">`;
                grid.appendChild(card);
            }
        }

        async function loadEpisodes(pid) {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${pid}&part=snippet&maxResults=10`);
            const data = await res.json();
            openPlayer(data.items[0].snippet.resourceId.videoId);
        }

        function openPlayer(id) {
            document.getElementById('videoModal').style.display = 'flex';
            player.loadVideoById(id);
        }

        document.getElementById('playBtn').onclick = () => {
            if (player.getPlayerState() == 1) player.pauseVideo();
            else player.playVideo();
        };

        function closePlayer() {
            player.stopVideo();
            document.getElementById('videoModal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
