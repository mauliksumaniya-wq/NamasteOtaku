<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamasteOtaku | Official Anime Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff9933; --bg: #0a0a0b; --card: #16171a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: white; overflow-x: hidden; }

        nav { padding: 15px 6%; background: #000; border-bottom: 1px solid #333; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: white; cursor: pointer; }
        .logo span { color: var(--primary); }

        main { padding: 20px 6%; min-height: 80vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        #backBtn { background: var(--primary); color: black; border: none; padding: 8px 18px; border-radius: 5px; font-weight: 800; cursor: pointer; display: none; }

        /* LIBRARY GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; height: 260px; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .info { padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,1)); position: absolute; bottom: 0; width: 100%; text-align: center; }

        /* EPISODE LIST */
        .ep-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .ep-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .ep-card:hover { border-color: var(--primary); }
        .ep-card img { width: 100%; height: 120px; object-fit: cover; }
        .ep-card p { padding: 10px; font-size: 12px; color: #ccc; }

        /* PLAYER - SKIP BUTTON FRIENDLY */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        .video-box { 
            width: 100%; max-width: 900px; 
            aspect-ratio: 16/9; 
            overflow: hidden; 
            position: relative; 
            background: #000;
        }

        #mainPlayer {
            position: absolute;
            top: -10%;    /* ऊपर का टाइटल छुपाने के लिए */
            left: 0;
            width: 100%;  
            height: 110%; /* नीचे का हिस्सा खुला रखा है ताकि 'Skip Ad' बटन दिखे */
            border: none;
        }

        .close-p { margin-top: 30px; color: #666; cursor: pointer; font-weight: 800; border: 1px solid #333; padding: 10px 40px; border-radius: 50px; }
        .close-p:hover { color: white; border-color: white; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">NAMASTE<span>OTAKU</span></div>
    </nav>

    <main>
        <div class="page-header">
            <h2 id="titleText">Featured Anime</h2>
            <button id="backBtn" onclick="location.reload()">← Back</button>
        </div>
        
        <div id="libraryGrid" class="grid"><p>Loading library...</p></div>
        <div id="episodeGrid" class="ep-grid"></div>
    </main>

    <div class="modal" id="videoModal">
        <div class="video-box">
            <iframe id="mainPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
        <div class="close-p" onclick="closePlayer()">CLOSE PLAYER</div>
    </div>

    <script>
        const API_KEY = 'AIzaSyDXbfCA2l6LWwg5iURIxbCPCbUlRLGlXWE'; 

        // अपना एनिमी डेटाबेस
        const animeDB = [
            { name: "Classroom of the Elite", id: "PLpm1VVK4UL17x8mbfPIYWRjkCTlrqEWW5" },
            { name: "Solo Leveling", id: "PLpm1VVK4UL15W7yE6yL1G_XzE7fWpE_L8" },
            { name: "Demon Slayer", id: "PLpm1VVK4UL15f_8uV_N3oA8_NqVf7X_r8" }
        ];

        // 1. लोड लाइब्रेरी
        async function init() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = ""; 

            for (const anime of animeDB) {
                try {
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(anime.name)}&limit=1`);
                    const data = await res.json();
                    const poster = data.data[0]?.images?.webp?.large_image_url || "https://via.placeholder.com/300x450";

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => loadEpisodes(anime.id, anime.name);
                    card.innerHTML = `<img src="${poster}"><div class="info"><h3>${anime.name}</h3></div>`;
                    grid.appendChild(card);
                } catch (e) {
                    console.error("Poster failed for " + anime.name);
                }
            }
        }

        // 2. लोड एपिसोड्स (IMPORTANT FIX)
        async function loadEpisodes(pid, name) {
            const lib = document.getElementById('libraryGrid');
            const ep = document.getElementById('episodeGrid');
            const back = document.getElementById('backBtn');
            const title = document.getElementById('titleText');

            lib.style.display = 'none';
            ep.style.display = 'grid';
            back.style.display = 'block';
            title.innerText = name;
            ep.innerHTML = "<p>Loading episodes from YouTube...</p>";

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${pid}&part=snippet&maxResults=50`);
                const data = await response.json();

                if (data.error) {
                    alert("YouTube API Error: " + data.error.message);
                    ep.innerHTML = "<p>Error: Check API Key or Quota.</p>";
                    return;
                }

                if (data.items && data.items.length > 0) {
                    ep.innerHTML = data.items.map(item => {
                        const vid = item.snippet.resourceId.videoId;
                        const epTitle = item.snippet.title;
                        const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url;

                        if (epTitle === "Private video" || epTitle === "Deleted video") return "";

                        return `
                            <div class="ep-card" onclick="openPlayer('${vid}')">
                                <img src="${thumb}">
                                <p>${epTitle}</p>
                            </div>`;
                    }).join('');
                } else {
                    ep.innerHTML = "<p>No episodes found in this playlist.</p>";
                }
            } catch (err) {
                ep.innerHTML = "<p>Connection error. Try again.</p>";
            }
        }

        // 3. प्लेयर फंक्शन
        function openPlayer(id) {
            // modestbranding=1 : लोगो छुपाता है
            // controls=1 : बहुत जरूरी है ताकि 'Skip Ad' बटन काम करे
            const playerUrl = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&controls=1&iv_load_policy=3`;
            document.getElementById('mainPlayer').src = playerUrl;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('mainPlayer').src = "";
            document.getElementById('videoModal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
