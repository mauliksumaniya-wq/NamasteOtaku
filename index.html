<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamasteOtaku | Classroom of the Elite</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9933">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff9933; --bg-black: #0a0a0b; --card-bg: #16171a; --text-white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-white); }
        nav { padding: 15px 6%; background: #000; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        main { padding: 40px 6%; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .anime-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; }
        .anime-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .anime-card img { width: 100%; height: 250px; object-fit: cover; background: #222; }
        .card-info { padding: 12px; }
        .card-info h3 { font-size: 14px; color: white; height: 40px; overflow: hidden; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal-container { width: 95%; max-width: 900px; position: relative; }
        .video-wrapper { position: relative; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }
        .close-modal { position: absolute; top: -50px; right: 0; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">NAMASTE<span>OTAKU</span></a>
    </nav>

    <main>
        <h2 style="margin-bottom: 30px;">Classroom of the Elite Episodes</h2>
        <div class="anime-grid" id="animeGrid">
            <p>Loading episodes...</p>
        </div>
    </main>

    <div class="modal" id="videoModal">
        <div class="modal-container">
            <span class="close-modal" onclick="closePlayer()">&times;</span>
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // YOUR DATA
    const API_KEY = 'AIzaSyDXbfCA2l6LWwg5iURIxbCPCbUlRLGlXWE'; 
    const PLAYLIST_ID = 'PLpm1VVK4UL17x8mbfPIYWRjkCTlrqEWW5'; 

    async function fetchPlaylist() {
        const grid = document.getElementById('animeGrid');
        try {
            const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${PLAYLIST_ID}&part=snippet&maxResults=50`);
            const data = await response.json();

            if (data.error) {
                console.error("API Error:", data.error.message);
                grid.innerHTML = `<p style="color:red">API Error: ${data.error.message}</p>`;
                return;
            }

            if (data.items) {
                // We use .filter first to remove any videos that don't have a proper title or ID
                const validItems = data.items.filter(item => {
                    const title = item.snippet?.title || "";
                    return title !== "Private video" && title !== "Deleted video";
                });

                grid.innerHTML = validItems.map(item => {
                    const videoId = item.snippet?.resourceId?.videoId;
                    const title = item.snippet?.title || "No Title Available";
                    
                    // SAFE THUMBNAIL LOGIC
                    // We try to get 'high', then 'medium', then 'default'. 
                    // If all fail, we use a placeholder image link.
                    const thumb = item.snippet?.thumbnails?.high?.url || 
                                  item.snippet?.thumbnails?.medium?.url || 
                                  item.snippet?.thumbnails?.default?.url || 
                                  "https://via.placeholder.com/300x450?text=No+Thumbnail";

                    return `
                        <div class="anime-card" onclick="openPlayer('${videoId}', '${title.replace(/'/g, "&apos;")}')">
                            <img src="${thumb}" alt="Thumbnail" onerror="this.src='https://via.placeholder.com/300x450?text=Image+Error'">
                            <div class="card-info">
                                <h3>${title}</h3>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error("Connection error:", error);
            grid.innerHTML = `<p style="color:red">Connection Failed. Please check internet or API Key.</p>`;
        }
    }

    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');

    function openPlayer(id, title) {
        if (!id) return; // Don't open if ID is missing
        player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        const vTitle = document.getElementById('videoTitle');
        if (vTitle) vTitle.innerText = title;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closePlayer() {
        player.src = "";
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    window.onclick = (e) => { if (e.target == modal) closePlayer(); }

    window.onload = fetchPlaylist;
    </script>
</body>
</html>
