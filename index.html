<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamasteOtaku | Official Hindi Dubbed Anime</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9933">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff9933; --bg: #0a0a0b; --card: #16171a; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--white); overflow-x: hidden; }
        
        nav { padding: 15px 6%; background: #000; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 800; text-decoration: none; color: white; cursor: pointer; }
        .logo span { color: var(--primary); }

        .download-btn { background: var(--primary); color: black; padding: 8px 15px; border-radius: 5px; font-weight: 800; text-decoration: none; font-size: 12px; }

        main { padding: 20px 6%; min-height: 80vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        #backBtn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: none; }

        /* --- POSTER GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .anime-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; position: relative; height: 250px; }
        .anime-card:hover { border-color: var(--primary); transform: scale(1.03); }
        .anime-card img { width: 100%; height: 100%; object-fit: cover; }
        .anime-card .info { padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); position: absolute; bottom: 0; width: 100%; text-align: center; }
        .anime-card h3 { font-size: 13px; }

        /* --- EPISODE LIST --- */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; display: none; }
        .ep-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .ep-card img { width: 100%; height: 120px; object-fit: cover; }
        .ep-card p { padding: 10px; font-size: 12px; color: #ccc; height: 50px; overflow: hidden; }

        /* --- PLAYER MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        .player-container { width: 100%; max-width: 900px; position: relative; }
        .video-wrapper { position: relative; padding-top: 56.25%; background: #000; }
        .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }
        
        /* Protection Layer: Stops users from clicking the title to go to YouTube */
        .player-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 50px; z-index: 10; background: transparent; }

        .player-controls { width: 100%; max-width: 900px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: #222; color: white; border: 1px solid #444; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .ctrl-btn:hover { background: var(--primary); color: black; }
        .close-player { color: #666; cursor: pointer; margin-top: 20px; font-weight: bold; }

        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">NAMASTE<span>OTAKU</span></div>
        <a href="#" class="download-btn">DOWNLOAD APP</a>
    </nav>

    <main>
        <div class="page-header">
            <h2 id="titleText">Featured Anime</h2>
            <button id="backBtn" onclick="location.reload()">← Back</button>
        </div>

        <div id="libraryGrid" class="grid"></div>
        <div id="episodeGrid" class="ep-grid"></div>
    </main>

    <!-- Player Modal -->
    <div class="modal" id="videoModal">
        <div class="player-container">
            <div class="player-overlay"></div> <!-- Blocks YouTube Link clicks -->
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn" id="prevEp">Previous</button>
            <button class="ctrl-btn" id="nextEp">Next Episode</button>
        </div>
        <div class="close-player" onclick="closePlayer()">CLOSE PLAYER</div>
    </div>

    <script>
        const YT_KEY = 'AIzaSyDXbfCA2l6LWwg5iURIxbCPCbUlRLGlXWE'; 

        // Add your playlists here
        const animeDB = [
            { name: "Classroom of the Elite", id: "PLpm1VVK4UL17x8mbfPIYWRjkCTlrqEWW5" },
            { name: "Re:ZERO -Starting Life in Another World", id: "PLpm1VVK4UL16i-EZjQaCvu70OTtrOLkog" },
            { name: "Demon Slayer", id: "PLpm1VVK4UL15f_8uV_N3oA8_NqVf7X_r8" }
        ];

        let currentPlaylist = [];
        let currentIndex = 0;

        async function getPoster(name) {
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(name)}&limit=1`);
                const data = await res.json();
                return data.data[0]?.images?.webp?.large_image_url || "https://via.placeholder.com/300x450";
            } catch { return "https://via.placeholder.com/300x450"; }
        }

        async function initLibrary() {
            const grid = document.getElementById('libraryGrid');
            for (const anime of animeDB) {
                const poster = await getPoster(anime.name);
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => loadEpisodes(anime.id, anime.name);
                card.innerHTML = `<img src="${poster}"><div class="info"><h3>${anime.name}</h3></div>`;
                grid.appendChild(card);
            }
        }

        async function loadEpisodes(id, name) {
            document.getElementById('libraryGrid').style.display = 'none';
            const epGrid = document.getElementById('episodeGrid');
            epGrid.style.display = 'grid';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('titleText').innerText = name;

            const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?key=${YT_KEY}&playlistId=${id}&part=snippet&maxResults=50`);
            const data = await res.json();
            currentPlaylist = data.items.filter(i => i.snippet.title !== "Private video");

            epGrid.innerHTML = currentPlaylist.map((item, index) => `
                <div class="ep-card" onclick="playVideo(${index})">
                    <img src="${item.snippet.thumbnails.medium.url}">
                    <p>${item.snippet.title}</p>
                </div>
            `).join('');
        }

        function playVideo(index) {
            currentIndex = index;
            const videoId = currentPlaylist[currentIndex].snippet.resourceId.videoId;
            const player = document.getElementById('videoPlayer');
            
            // Modest Branding & rel=0 prevents YouTube interference
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0&iv_load_policy=3&showinfo=0`;
            
            document.getElementById('videoModal').style.display = 'flex';
            
            // Handle Next/Prev Button Visibility
            document.getElementById('nextEp').style.visibility = (currentIndex < currentPlaylist.length - 1) ? 'visible' : 'hidden';
            document.getElementById('prevEp').style.visibility = (currentIndex > 0) ? 'visible' : 'hidden';
        }

        document.getElementById('nextEp').onclick = () => playVideo(currentIndex + 1);
        document.getElementById('prevEp').onclick = () => playVideo(currentIndex - 1);

        function closePlayer() {
            document.getElementById('videoPlayer').src = "";
            document.getElementById('videoModal').style.display = 'none';
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        window.onload = initLibrary;
    </script>
</body>
</html>
