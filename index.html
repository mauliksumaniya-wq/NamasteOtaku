<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamasteOtaku | Official Anime App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff9933; --bg: #0a0a0b; --card: #16171a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: white; overflow-x: hidden; }

        nav { padding: 15px 6%; background: #000; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; cursor: pointer; }
        .logo span { color: var(--primary); }

        main { padding: 20px 6%; min-height: 85vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        #backBtn { background: var(--primary); color: black; border: none; padding: 8px 18px; border-radius: 5px; font-weight: 800; cursor: pointer; display: none; }

        /* --- LIBRARY VIEW --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; height: 260px; position: relative; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .info { padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,1)); position: absolute; bottom: 0; width: 100%; text-align: center; }

        /* --- EPISODE VIEW --- */
        .ep-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .ep-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .ep-card img { width: 100%; height: 120px; object-fit: cover; }
        .ep-card p { padding: 10px; font-size: 12px; color: #ccc; line-height: 1.4; }

        /* --- PLAYER MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        
        .player-mask { 
            width: 100%; max-width: 900px; aspect-ratio: 16/9; 
            overflow: hidden; position: relative; background: #000; border-radius: 10px;
        }

        #videoPlayer {
            position: absolute;
            top: -12%; /* Titles/Logo Hide */
            left: -5%;
            width: 110%; 
            height: 125%;
            border: none;
        }

        .guard { position: absolute; top: 0; left: 0; width: 100%; height: 80px; z-index: 10; cursor: default; }

        .player-footer { width: 95%; max-width: 900px; padding: 20px 0; text-align: left; }
        .close-btn { color: #666; cursor: pointer; font-weight: 800; border: 1px solid #333; padding: 10px 30px; border-radius: 50px; display: inline-block; }

        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.reload()">NAMASTE<span>OTAKU</span></div>
    </nav>

    <main>
        <div class="page-header">
            <h2 id="headerText">Discover Anime</h2>
            <button id="backBtn" onclick="location.reload()">← Back</button>
        </div>
        
        <!-- Screen 1: List of Series -->
        <div id="libraryGrid" class="grid">
            <p>Loading Library...</p>
        </div>
        
        <!-- Screen 2: List of Episodes -->
        <div id="episodeGrid" class="ep-grid"></div>
    </main>

    <!-- Professional Player -->
    <div class="modal" id="videoModal">
        <div class="player-mask">
            <div class="guard"></div>
            <iframe id="videoPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
        <div class="player-footer">
            <h3 id="playingTitle" style="color:var(--primary); margin-bottom: 5px;">Episode Title</h3>
            <p style="font-size: 12px; color: #555;">Official Source: Licensed Content</p>
            <br>
            <div class="close-btn" onclick="closePlayer()">CLOSE PLAYER</div>
        </div>
    </div>

    <script>
        const YT_KEY = 'AIzaSyDXbfCA2l6LWwg5iURIxbCPCbUlRLGlXWE'; 
        
        // एनिमी डेटाबेस
        const animeDB = [
            { name: "Classroom of the Elite", id: "PLpm1VVK4UL17x8mbfPIYWRjkCTlrqEWW5" },
            { name: "Solo Leveling", id: "PLpm1VVK4UL15W7yE6yL1G_XzE7fWpE_L8" },
            { name: "Demon Slayer", id: "PLpm1VVK4UL15f_8uV_N3oA8_NqVf7X_r8" }
        ];

        // --- 1. लोड लाइब्रेरी (Posters) ---
        async function loadLibrary() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = "";
            
            for (const anime of animeDB) {
                try {
                    // Fetch Poster using Jikan API
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(anime.name)}&limit=1`);
                    const data = await res.json();
                    const poster = data.data[0]?.images?.webp?.large_image_url || "https://via.placeholder.com/300x450";

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => loadEpisodes(anime.id, anime.name);
                    card.innerHTML = `
                        <img src="${poster}">
                        <div class="info"><h3>${anime.name}</h3></div>
                    `;
                    grid.appendChild(card);
                } catch (e) {
                    console.log("Error loading poster for " + anime.name);
                }
            }
        }

        // --- 2. लोड एपिसोड्स (Playlist) ---
        async function loadEpisodes(playlistId, animeName) {
            console.log("Fetching Episodes for: " + animeName);
            
            document.getElementById('libraryGrid').style.display = 'none';
            const epGrid = document.getElementById('episodeGrid');
            epGrid.style.display = 'grid';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('headerText').innerText = animeName;
            
            epGrid.innerHTML = "<p>Loading episodes...</p>";

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?key=${YT_KEY}&playlistId=${playlistId}&part=snippet&maxResults=50`);
                const data = await res.json();

                if (data.items) {
                    epGrid.innerHTML = data.items.map(item => {
                        const vid = item.snippet.resourceId.videoId;
                        const title = item.snippet.title;
                        const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url;

                        if (title === "Private video" || title === "Deleted video") return "";

                        return `
                            <div class="ep-card" onclick="openPlayer('${vid}', '${title.replace(/'/g, "")}')">
                                <img src="${thumb}">
                                <p>${title}</p>
                            </div>
                        `;
                    }).join('');
                } else {
                    epGrid.innerHTML = "<p>No episodes found.</p>";
                }
            } catch (e) {
                console.log("Error loading episodes: " + e);
                epGrid.innerHTML = "<p>Failed to load episodes. Check API Key.</p>";
            }
        }

        // --- 3. प्लेयर फंक्शन ---
        function openPlayer(id, title) {
            const player = document.getElementById('videoPlayer');
            // modestbranding=1 & rel=0 for professional look
            player.src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&iv_load_policy=3`;
            
            document.getElementById('playingTitle').innerText = title;
            document.getElementById('videoModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            document.getElementById('videoPlayer').src = "";
            document.getElementById('videoModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Initial Start
        window.onload = loadLibrary;
    </script>
</body>
</html>
